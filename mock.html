<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Unit 1 Test</title>
  <!--
    The mock (PRD §6.4): the practice copy's sections, tasks and points, with all content new.
    Three views, each printed on its own: the test (9 pages, A4), the answer key, two pages for the coach.
    Everything on the pages comes from CONTENT.mock in content.js; this file only lays it out.
    The layout follows the scan of the practice copy: one section to a page, the task line on the left with its
    points, the Hebrew and Arabic instruction on the right.
    Open with ?view=test | key | coach.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #7d828c; color: #111; font-family: Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif; }
    .emo { font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif; }

    /* the bar: on screen only */
    .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: #20232b; color: #fff; direction: rtl; font-family: -apple-system, "Rubik", Arial, sans-serif; }
    .bar button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid #5a6070; background: #2f3440; color: #fff; cursor: pointer; }
    .bar button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
    .bar .sep { align-self: stretch; width: 1px; background: #555b68; margin: 0 4px; }
    .bar .status { font-size: 15px; min-height: 1.2em; }
    .bar a { color: #fff; font-size: 16px; padding: 8px 6px; }
    .bar a[hidden] { display: none; }

    main { display: none; }
    body.v-test #test, body.v-key #key, body.v-coach #coach { display: block; }

    .page { width: 210mm; min-height: 297mm; margin: 8mm auto; padding: 13mm 18mm 13mm; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); position: relative; font-size: 13.5pt; line-height: 1.4; }
    .foot { position: absolute; bottom: 6mm; right: 18mm; font-size: 10pt; font-weight: 700; }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      main { zoom: 1 !important; }
      .page { margin: 0; box-shadow: none; min-height: 0; height: 296mm; overflow: hidden; break-after: page; }
      .page:last-child { break-after: auto; }
    }

    /* ---- the test ---- */
    .top { display: flex; align-items: flex-end; gap: 8mm; margin-bottom: 9mm; }
    .top .tab { font-weight: 900; font-size: 26pt; line-height: 1; padding: 5mm 7mm 3mm 3mm; border: 2px solid #111; border-bottom: 0; border-radius: 8px 8px 0 0; white-space: nowrap; }
    .top .who { flex: 1; display: flex; justify-content: flex-end; gap: 7mm; font-size: 13pt; border-bottom: 5px solid #111; padding-bottom: 3mm; }
    .top .who i { display: inline-block; border-bottom: 1.5px dotted #111; }
    .mini { position: absolute; top: 9mm; right: 18mm; border: 1.5px solid #111; border-radius: 4px; padding: 2mm 5mm; font-weight: 700; font-size: 11pt; }
    .page.more { padding-top: 26mm; }

    h2.sec { font-size: 18pt; font-weight: 900; margin: 0 0 5mm; letter-spacing: .2px; }
    h2.sec small { font-size: 11.5pt; font-weight: 700; }
    .task { display: flex; justify-content: space-between; align-items: flex-start; gap: 8mm; margin: 8mm 0 5mm; }
    h2.sec + .task { margin-top: 0; }
    .task .en { font-size: 14.5pt; }
    .task .en b.n { font-weight: 900; margin-inline-end: 3.5mm; }
    .task .en small { font-size: 10pt; font-weight: 700; white-space: nowrap; }
    .task .tr { font-size: 9.5pt; line-height: 1.4; text-align: right; max-width: 82mm; color: #111; }
    .ind { margin-inline-start: 9mm; }

    ol.q { list-style: none; margin: 0; padding: 0; counter-reset: q; }
    ol.q > li { counter-increment: q; display: flex; gap: 2mm; margin: 0 0 3.2mm; align-items: baseline; }
    ol.q > li::before { content: counter(q) "."; min-width: 7mm; }
    .blank { display: inline-block; min-width: 30mm; border-bottom: 1.3px dotted #111; height: 1.05em; margin: 0 1.5mm; vertical-align: baseline; }
    .blank.wide { min-width: 40mm; }
    .bankline { font-weight: 700; margin: 0 0 5mm; padding-inline-start: 9mm; display: flex; flex-wrap: wrap; gap: 1mm 4mm; align-items: center; }
    .bankline.mid { justify-content: center; padding: 0; }
    .bankline i { font-style: normal; font-size: 9pt; }
    .bankline.tight { margin-bottom: 1.5mm; }

    /* Listening 1: six pictures, a letter and a box for the number in the corner */
    .lpics { display: grid; grid-template-columns: 62mm 62mm; gap: 9mm 15mm; justify-content: center; margin-top: 9mm; }
    .lp { position: relative; border: 1.5px solid #111; height: 55mm; display: flex; align-items: center; justify-content: center; font-size: 38pt; white-space: nowrap; gap: 3mm; }
    .lp b.d { font: 700 30pt Arial, sans-serif; }
    .tag { position: absolute; top: -1.5px; left: -1.5px; display: flex; font: 700 11pt Arial, sans-serif; }
    .tag b { background: #111; color: #fff; width: 7.5mm; height: 7.5mm; display: flex; align-items: center; justify-content: center; }
    .tag i { width: 8.5mm; height: 7.5mm; border: 1.5px solid #111; border-inline-start: 0; background: #fff; }
    @media print { .tag b { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }

    /* a sentence to complete, with its endings underneath */
    .mc { margin: 0 0 3.5mm; }
    .mc .stem { display: flex; gap: 2mm; }
    .mc .stem .qn { min-width: 7mm; }
    .mc ol { list-style: none; margin: 1mm 0 0; padding: 0 0 0 9mm; }
    .mc.flat ol { padding-left: 0; }
    .mc li { display: flex; gap: 3mm; margin: 0 0 1.2mm; }
    .mc li .l { min-width: 6mm; }

    .tpics { display: flex; gap: 3mm; margin-top: 3mm; }
    .tp { position: relative; flex: 1; border: 1.5px solid #111; height: 27mm; display: flex; align-items: center; justify-content: center; font-size: 22pt; white-space: nowrap; }
    .yn { border-collapse: collapse; margin-inline-start: 9mm; }
    .yn th { font-weight: 400; padding: 0 5mm 1mm; }
    .yn td { padding: 2.2mm 0; }
    .yn td.s { padding-inline-end: 14mm; }
    .yn td.c { text-align: center; width: 17mm; }
    .yn td.c + td.c, .yn th + th + th { border-inline-start: 1.5px solid #111; }
    .yn td.c i { display: inline-block; width: 7mm; border-bottom: 1.3px solid #111; height: 1em; }

    /* Vocabulary 1 and Reading 1: two columns, A and B */
    .ab { display: flex; gap: 14mm; margin-inline-start: 9mm; }
    .ab h4 { margin: 0 0 3mm; font-size: 12.5pt; }
    .ab .a h4 { padding-inline-start: 9mm; }
    .ab .b h4 { padding-inline-start: 21mm; }
    .ab .a li, .ab .b li { height: 9.2mm; margin: 0; align-items: center; }
    .ab .b ol { list-style: none; margin: 0; padding: 0; }
    .ab .b li { display: flex; gap: 3mm; align-items: center; }
    .ab .b li i { display: inline-block; width: 10mm; border-bottom: 1.3px solid #111; height: 7mm; }
    .ab .b li .l { min-width: 6mm; }
    .ab .b li .w { direction: rtl; unicode-bidi: isolate; font-size: 12pt; }

    .halves { display: grid; grid-template-columns: 9mm 82mm 1fr 14mm 56mm; row-gap: 12mm; align-items: center; margin-top: 4mm; }
    .halves .hd { font-weight: 700; font-size: 12.5pt; }
    .halves .bx { border: 1.5px solid #111; border-radius: 9px; padding: 0 4mm; height: 23mm; display: flex; align-items: center; }
    .halves .ln { display: flex; align-items: center; gap: 2mm; }
    .halves .ln i { display: inline-block; width: 6mm; border-bottom: 1.3px dotted #111; height: 1em; }

    .passage { border: 1.5px solid #111; padding: 4mm 6mm 2mm; font-size: 13.5pt; line-height: 1.5; margin: 0 0 2mm; }
    .passage p { margin: 0 0 2.5mm; }
    .w2 { list-style: none; margin: 0 0 0 9mm; padding: 0; counter-reset: q; }
    .w2 li { counter-increment: q; display: flex; gap: 2mm; align-items: flex-end; height: 10mm; }
    .w2 li::before { content: counter(q) "."; }
    .w2 li i { width: 60mm; border-bottom: 1.3px dotted #111; }
    .tf li { justify-content: flex-start; }
    .tf li .s { flex: 0 0 112mm; }
    .tf li b { white-space: nowrap; }
    .t2 { list-style: none; margin: 1mm 0 0 9mm; padding: 0; counter-reset: q; }
    .t2 li { counter-increment: q; display: flex; gap: 3mm; align-items: baseline; margin: 0 0 1.6mm; }
    .t2 li i { display: inline-block; width: 8mm; border-bottom: 1.3px solid #111; height: 1em; }
    .t2 li span::before { content: counter(q) ".\00a0\00a0"; }

    /* Writing: the bank above the picture, the people on one ground line, each with a name label */
    .scene { border: 1.5px solid #111; padding: 6mm 3mm 3mm; margin: 2mm 0 5mm; display: grid; grid-template-rows: auto auto; grid-auto-flow: column; }
    .scene .up { display: flex; align-items: flex-end; justify-content: center; border-bottom: 1.5px solid #111; }
    .scene .up svg { display: block; }
    .scene .up.gap { min-width: 3mm; }   /* the space between two figures takes what is left, so a thing stays by its owner */
    .scene .dn { text-align: center; padding-top: 2mm; }
    .scene .dn span { display: inline-block; border: 1.2px solid #111; padding: 0 2mm; font-size: 11.5pt; background: #fff; }
    .scene .obj { font-size: 24pt; line-height: 1.05; }
    .scene .obj.held { padding-bottom: 21mm; margin-inline-start: -3mm; font-size: 22pt; }
    .wlines { list-style: none; margin: 0; padding: 0; counter-reset: w; }
    .wlines li { counter-increment: w; display: flex; align-items: flex-end; gap: 3mm; height: 13mm; }
    .wlines li::before { content: counter(w) "."; min-width: 6mm; }
    .wlines li::after { content: ""; flex: 1; border-bottom: 1.3px dotted #111; }

    /* ---- the key and the coach's pages ---- */
    .key h2, .coach h2 { font-size: 13pt; margin: 9px 0 3px; border-bottom: 1.2px solid #111; padding-bottom: 2px; }
    .key .title, .coach .title { font-size: 19pt; margin: 0 0 2px; }
    .key { font-size: 11.5pt; line-height: 1.4; }
    .key .row { display: flex; flex-wrap: wrap; gap: 2px 8mm; margin: 2px 0; }
    .key .n { display: inline-block; min-width: 1.4em; color: #333; }
    .key .row > .long { flex: 1; }
    .key .he { direction: rtl; unicode-bidi: isolate; }
    .key .kpics { display: flex; gap: 4mm; margin: 4px 0; }
    .key .kpics div { border: 1.2px solid #111; padding: 2px 7px; text-align: center; font-size: 14pt; white-space: nowrap; }
    .key .kpics div b { display: block; font: 700 12.5pt Arial, sans-serif; }
    .key .kpics div i { font: 700 12pt Arial, sans-serif; }
    .key .checks { direction: rtl; text-align: right; margin: 5px 0 0; padding-inline-start: 22px; font-size: 12pt; line-height: 1.6; }
    .key .checks .en, .coach .en { direction: ltr; unicode-bidi: isolate; white-space: nowrap; font-family: Arial, sans-serif; }
    .coach { direction: rtl; font-family: -apple-system, "Rubik", Arial, "Liberation Sans", sans-serif; font-size: 12pt; line-height: 1.55; }
    .coach ol, .coach ul { margin: 4px 0; padding-inline-start: 22px; }
    .coach li { margin-bottom: 3px; }
    .coach .script { direction: ltr; text-align: left; font-family: Arial, sans-serif; font-size: 12.5pt; line-height: 1.55; border: 1.2px solid #111; border-radius: 5px; padding: 6px 12px; margin: 4px 0; }
    .coach .script b { display: inline-block; min-width: 4.2em; }
    .coach table { border-collapse: collapse; width: 100%; margin-top: 4px; font-size: 11.5pt; }
    .coach th, .coach td { border: 1.2px solid #111; padding: 6px 8px; text-align: right; }
    .coach td.num, .coach th.num { text-align: center; width: 22mm; }
    .coach td:first-child { white-space: nowrap; }
    .coach .note { font-size: 11pt; color: #222; }
  </style>
</head>
<body class="v-test">
  <div class="bar" id="bar">
    <button data-view="test">המבחן</button>
    <button data-view="key">מפתח תשובות</button>
    <button data-view="coach">דף למאמן</button>
    <span class="sep"></span>
    <button data-play="a">🔊 האזנה 1</button>
    <button data-play="b">🔊 האזנה 2</button>
    <button data-play="stop">■</button>
    <span class="sep"></span>
    <button id="print">הדפסה</button>
    <a id="back" href="index.html" hidden>חזרה למשחק</a>
    <span class="status" id="status"></span>
  </div>
  <main id="test"></main>
  <main id="key"></main>
  <main id="coach"></main>

  <script src="content.js?v=3.4.0"></script>
  <script>
  (function () {
    'use strict';
    const M = window.CONTENT.mock;
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const abc = i => 'abcdefghij'[i];
    const sum = a => a.reduce((x, y) => x + y, 0);
    const blank = (t, wide) => esc(t).replace('___', `<span class="blank${wide ? ' wide' : ''}"></span>`);
    const emo = s => `<span class="emo">${s}</span>`;
    // a picture string: emoji, and a number where the picture has one (the cake)
    const picParts = s => { const m = /^(\S+) (\d+)$/.exec(s); return m ? { e: m[1], d: m[2] } : { e: s }; };

    const L = M.listening, V = M.vocab, G = M.grammar, R = M.reading, W = M.writing, ST = R.story;
    const DQ = L.dialogue.questions, spoken = L.pics.items.filter(it => it.say);
    const ofType = (qs, ...ts) => qs.filter(q => ts.includes(q.type));

    // ---------- points (the weights are content settings) ----------
    const P = {
      l1: L.pics.pts * spoken.length, l2: sum(DQ.map(q => q.pts)),
      v1: V.match.pts * V.match.items.length, v2: V.bank.pts * V.bank.items.length,
      g1: G.be.pts * G.be.items.length, g2: G.circle.pts * G.circle.items.length, g3: G.have.pts * G.have.items.length,
      r1: R.halves.pts * R.halves.items.length, r2: sum(ST.questions.map(q => q.pts)),
      w: W.pts * (W.be + W.have),
    };
    const SEC = { l: P.l1 + P.l2, v: P.v1 + P.v2, g: P.g1 + P.g2 + P.g3, r: P.r1 + P.r2, w: P.w };
    const TOTAL = sum(Object.values(SEC));

    // ---------- small builders ----------
    const x = (n, p) => `${n} x ${p} point${p === 1 ? '' : 's'}`;
    const secH = (en, pts) => `<h2 class="sec">${en} <small>(${pts} points)</small></h2>`;
    // a task line: its number, the English instruction and the points on the left; Hebrew and Arabic on the right
    const task = (n, en, pts, he, ar) => `<div class="task"><div class="en">${n ? `<b class="n">${n}</b>` : ''}${en}${pts ? ` <small>(${pts})</small>` : ''}</div><div class="tr" dir="rtl"><div lang="he">${he}</div><div lang="ar">${ar}</div></div></div>`;
    const page = (n, inner) => `<section class="page${n > 1 ? ' more' : ''}">${n > 1 ? `<div class="mini">${esc(M.title)}</div>` : ''}${inner}<div class="foot">${n}</div></section>`;
    const bank = (words, cls) => `<div class="bankline ${cls || ''}">${words.map(esc).join('<i>●</i>').replace(/(<i>●<\/i>)/g, ' $1 ')}</div>`;
    // a sentence to complete: the stem, then its endings a to d, one to a line
    const mc = (q, n, cls) => `<div class="mc ${cls || ''}"><div class="stem">${n ? `<span class="qn">${n}.</span>` : ''}<span>${esc(q.en.includes('...') ? q.en + '.' : q.en + ' ... .')}</span></div><ol>${q.choices.map((c, j) => `<li><span class="l">${abc(j)}.</span><span>${esc(c.en)}</span></li>`).join('')}</ol></div>`;
    const mcKey = q => { const j = q.choices.findIndex(c => c.ok); return `${abc(j)}. ${esc(q.choices[j].en)}`; };

    // a figure for the writing picture: line art, so it prints the same on any printer.
    // The body and the legs carry the height; the head stays one size.
    function kidSvg(g, mood, size, look) {
      const T = { tall: 54, mid: 38, short: 25 }[size], Lg = { tall: 60, mid: 40, short: 24 }[size];
      const cx = 25, r = 13, hy = r + 4, sh = hy + r + 4, hip = sh + T, hem = g === 'f' ? hip + 6 : hip, foot = hip + Lg, H = foot + 3;
      const st = 'fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
      const stw = st.replace('fill="none"', 'fill="#fff"'), old = look === 'old';
      const hair = g === 'f'
        ? `<path d="M${cx - r - 2} ${hy + r + 8} Q${cx - r - 7} ${hy - r - 7} ${cx} ${hy - r - 3} Q${cx + r + 7} ${hy - r - 7} ${cx + r + 2} ${hy + r + 8} L${cx + r - 5} ${hy + r} L${cx - r + 5} ${hy + r}Z" fill="#111"/>` : '';
      const fringe = g === 'f'
        ? `<path d="M${cx - r + 1} ${hy - 4} Q${cx} ${hy - r - 2} ${cx + r - 1} ${hy - 4} Q${cx} ${hy - 9} ${cx - r + 1} ${hy - 4}Z" fill="#111"/>`
        : old ? `<path d="M${cx - r - 1} ${hy - 4} q-3 4 0 9M${cx + r + 1} ${hy - 4} q3 4 0 9" ${st}/>`
          : `<path d="M${cx - r} ${hy - 3} A${r} ${r} 0 0 1 ${cx + r} ${hy - 3} Q${cx + 3} ${hy - 9} ${cx - r} ${hy - 3}Z" fill="#111"/>`;
      const eyes = `<circle cx="${cx - 5}" cy="${hy - 1}" r="1.7" fill="#111"/><circle cx="${cx + 5}" cy="${hy - 1}" r="1.7" fill="#111"/>`
        + (old ? `<circle cx="${cx - 5}" cy="${hy - 1}" r="4.2" ${st.replace('stroke-width="2"', 'stroke-width="1.4"')}/><circle cx="${cx + 5}" cy="${hy - 1}" r="4.2" ${st.replace('stroke-width="2"', 'stroke-width="1.4"')}/>` : '');
      const mouth = mood === 'happy' ? `<path d="M${cx - 7} ${hy + 4} Q${cx} ${hy + 13} ${cx + 7} ${hy + 4}Z" ${stw}/>`
        : mood === 'sad' ? `<path d="M${cx - 5.5} ${hy + 9} Q${cx} ${hy + 3.5} ${cx + 5.5} ${hy + 9}" ${st}/><path d="M${cx + 8} ${hy + 1.5} q-2 3.8 0 4.8 q2 -1 0 -4.8Z" fill="#111"/>`
        : old ? `<path d="M${cx - 6} ${hy + 6} q3 -3 6 0 q3 -3 6 0" ${st}/><path d="M${cx - 6} ${hy + 8} Q${cx} ${hy + 19} ${cx + 6} ${hy + 8}Z" ${stw.replace('stroke-width="2"', 'stroke-width="1.4"')}/>`
        : `<path d="M${cx - 4} ${hy + 6} L${cx + 4} ${hy + 6}" ${st}/>`;
      const body = g === 'f'
        ? `<path d="M${cx - 8} ${sh} L${cx + 8} ${sh} L${cx + 16} ${hem} L${cx - 16} ${hem}Z" ${stw}/>`
        : `<rect x="${cx - 10}" y="${sh}" width="20" height="${T}" rx="4" ${stw}/>`;
      const legs = `<path d="M${cx - 5} ${hem} L${cx - 6} ${foot} l-5 0M${cx + 5} ${hem} L${cx + 6} ${foot} l5 0" ${st}/>`;
      const sx = g === 'f' ? 8 : 10, hand = sh + T * 0.72;
      const arms = mood === 'happy'
        ? `<path d="M${cx - sx} ${sh + 4} L${cx - 23} ${sh - 11}M${cx + sx} ${sh + 4} L${cx + 23} ${sh - 11}" ${st}/>`
        : `<path d="M${cx - sx} ${sh + 4} L${cx - 20} ${hand}M${cx + sx} ${sh + 4} L${cx + 20} ${hand}" ${st}/>`;
      const stick = old ? `<path d="M${cx - 20} ${foot} L${cx - 20} ${hand - 4} q0 -5 5 -5" ${st.replace('stroke-width="2"', 'stroke-width="2.6"')}/>` : '';
      const neck = `<path d="M${cx} ${hy + r} L${cx} ${sh}" ${st}/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 ${H}" width="${50 * 0.35}mm" height="${H * 0.35}mm" aria-hidden="true">${hair}${neck}${arms}${legs}${body}${stick}<circle cx="${cx}" cy="${hy}" r="${r}" ${stw}/>${fringe}${eyes}${mouth}</svg>`;
    }
    // one figure or one thing is a column of the picture: what stands on the ground, and the name label under it
    const col = (up, dn, cls) => `<div class="up ${cls || ''}">${up}</div><div class="dn">${dn ? `<span>${dn}</span>` : ''}</div>`;
    function figHtml(f) {
      const kid = i => col(kidSvg(f.g[i], f.mood, f.size, f.look), esc(f.who[i]));
      const obj = col(`<span class="obj emo${f.has === 'book' || f.many ? ' held' : ''}">${f.e}</span>`);
      return kid(0) + obj + (f.who.length > 1 ? kid(1) : '');
    }
    const names = f => f.who.join(' and ');
    const beSentence = f => `${names(f)} ${f.who.length > 1 ? 'are' : 'is'} ${f.adj}.`;
    const haveSentence = f => `${names(f)} ${f.who.length > 1 ? 'have' : 'has'} ${f.many ? '' : 'a '}${f.has}.`;

    // the tasks of the reading passage, in the printed order: neighbours of one kind (the true / false pair) are one task
    function storyTasks() {
      const out = [];
      ST.questions.forEach(q => { const last = out[out.length - 1]; if (last && last.type === q.type && q.type === 'tf') last.qs.push(q); else out.push({ type: q.type, qs: [q] }); });
      return out;
    }

    // ---------- the test: nine pages, broken where the practice copy breaks ----------
    function renderTest() {
      const nPics = L.pics.items.length;
      const p1 = `
        <div class="top"><div class="tab">${esc(M.title)}</div><div class="who"><span>Name: <i style="width:52mm">&nbsp;</i></span><span>Grade: <i style="width:14mm">&nbsp;</i></span></div></div>
        ${secH('Listening 1', P.l1)}
        ${task('', 'Listen and number.', x(spoken.length, L.pics.pts),

    function renderCoach() {

        <h2>האזנה 2</h2>
        <div class="script">${L.dialogue.lines.map(l => `<div><b>${esc(L.dialogue.who[l.who])}:</b> ${esc(l.en)}</div>`).join('')}</div>
        </section><section class="page coach" lang="he">

          ${tr('Listening 2', `משימה 1: ${cs.length} משפטים, ${cs[0].pts} לכל אחד · משימה 2: ${tk.pts / 2} לכל תמונה נכונה · משימה 3: ${yn[0].pts} לכל משפט`, P.l2)}

    // ---------- views ----------
    const VIEWS = ['test', 'key', 'coach'];
    function setView(v) {
      if (!VIEWS.includes(v)) v = 'test';
      document.body.className = 'v-' + v;
      document.querySelectorAll('#bar [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
      document.title = v === 'test' ? M.title : v === 'key' ? M.title + ' · Answers' : M.title + ' · Coach';
    }
    // on a screen narrower than a sheet (an iPad held upright is just wide enough), the sheets shrink to fit
    function fit() {
      const w = 210 * 96 / 25.4 + 24, z = Math.min(1, window.innerWidth / w);
      document.querySelectorAll('main').forEach(m => { m.style.zoom = z < 1 ? z : ''; });
    }

    // ---------- the listening, in the device's voices (as the game speaks its dialogues) ----------
    const Say = {
      v1: null, v2: null, run: 0,
      ok: () => 'speechSynthesis' in window,
      pick() {
        if (!this.ok()) return;
        const vs = speechSynthesis.getVoices(); if (!vs.length) return;
        const pref = ['Samantha', 'Google US English', 'Alex', 'Ava', 'Allison'];
        this.v1 = vs.find(v => pref.includes(v.name) && v.lang.startsWith('en')) || vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang.startsWith('en')) || null;
        const pref2 = ['Daniel', 'Google UK English Male', 'Alex', 'Tom', 'Aaron', 'Fred'];
        const other = v => v.lang.startsWith('en') && (!this.v1 || v.name !== this.v1.name);
        this.v2 = vs.find(v => pref2.includes(v.name) && other(v)) || vs.find(v => v.lang === 'en-GB' && other(v)) || null;
      },
      // one line; resolves when it has been said (or after 15 s, if the device never reports the end)
      line(text, who) {
        return new Promise(res => {
          let done = false; const fin = () => { if (!done) { done = true; res(); } };
          try {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
            if (who === 'b' && this.v2) { u.voice = this.v2; u.lang = this.v2.lang; }
            else { if (this.v1) u.voice = this.v1; if (who === 'b') u.pitch = 0.6; }
            u.onend = u.onerror = fin;
            speechSynthesis.speak(u);
          } catch (e) { fin(); }
          setTimeout(fin, 15000);
        });
      },
      stop() { this.run++; try { if (this.ok()) speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
    };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const status = t => { document.getElementById('status').textContent = t; };
    async function play(part) {
      Say.stop();
      if (part === 'stop') return status('');
      if (!Say.ok()) return status('אין קול במכשיר הזה. הטקסט נמצא ב"דף למאמן".');
      Say.pick();
      const my = Say.run, live = () => my === Say.run, name = part === 'a' ? 'האזנה 1' : 'האזנה 2';
      const nums = ['one', 'two', 'three', 'four', 'five', 'six'];
      for (let pass = 1; pass <= 2 && live(); pass++) {
        status(`${name} · השמעה ${pass} מתוך 2`);
        if (part === 'a') {
          for (let i = 0; i < spoken.length && live(); i++) {
            await Say.line(`Number ${nums[i]}.`); await wait(500); if (!live()) return;
            await Say.line(spoken[i].say); await wait(3500); if (!live()) return;
          }
        } else {
          for (const l of L.dialogue.lines) { await Say.line(l.en, l.who); await wait(600); if (!live()) return; }
        }
        if (pass === 1) await wait(4000);
      }
      if (live()) status(`${name} · הסתיים`);
    }
    if (Say.ok()) speechSynthesis.onvoiceschanged = () => Say.pick();

    // ---------- start ----------
    renderTest(); renderKey(); renderCoach();
    setView(new URLSearchParams(location.search).get('view') || 'test');
    fit(); window.addEventListener('resize', fit);
    document.getElementById('bar').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.view) setView(b.dataset.view);
      else if (b.dataset.play) play(b.dataset.play);
      else if (b.id === 'print') { Say.stop(); status(''); window.print(); }
    });
    // Opened from the game on the home screen there is no browser around the page, so it needs its own way back.
    // In a browser the link stays hidden: there, index.html would be a different save (the home-screen game keeps its own).
    if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.getElementById('back').hidden = false;
    window.__mock = { play, Say, setView, P, SEC, TOTAL };
  })();
  </script>
</body>
