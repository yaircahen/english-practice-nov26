<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Unit 1 Test</title>
  <!--
    The mock (PRD §6.4): the practice copy's five sections and point weights, all content new.
    Three views, each printed on its own: the test (5 pages, A4), the answer key, a page for the coach.
    Everything on the pages comes from CONTENT.mock in content.js; this file only lays it out.
    Open with ?view=test | key | coach.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #7d828c; color: #111; font-family: Arial, "Helvetica Neue", Helvetica, "Liberation Sans", sans-serif; }
    .emo { font-family: "Apple Color Emoji", "Noto Color Emoji", "Segoe UI Emoji", sans-serif; }

    /* the bar: on screen only */
    .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: #20232b; color: #fff; direction: rtl; font-family: -apple-system, "Rubik", Arial, sans-serif; }
    .bar button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid #5a6070; background: #2f3440; color: #fff; cursor: pointer; }
    .bar button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
    .bar .sep { align-self: stretch; width: 1px; background: #555b68; margin: 0 4px; }
    .bar .status { font-size: 15px; min-height: 1.2em; }
    .bar a { color: #fff; font-size: 16px; padding: 8px 6px; }
    .bar a[hidden] { display: none; }

    main { display: none; }
    body.v-test #test, body.v-key #key, body.v-coach #coach { display: block; }

    .page { width: 210mm; min-height: 297mm; margin: 8mm auto; padding: 11mm 15mm 12mm; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); position: relative; font-size: 13pt; line-height: 1.4; }
    .foot { position: absolute; bottom: 5mm; left: 15mm; right: 15mm; display: flex; justify-content: space-between; font-size: 9pt; color: #444; }

    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      main { zoom: 1 !important; }
      .page { margin: 0; box-shadow: none; min-height: 0; height: 296mm; overflow: hidden; break-after: page; }
      .page:last-child { break-after: auto; }
    }

    /* the test */
    .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 10mm; border-bottom: 2.5px solid #111; padding-bottom: 5px; margin-bottom: 9px; }
    .head h1 { font-size: 21pt; margin: 0; }
    .head .who { display: flex; gap: 8mm; font-size: 12pt; }
    .head .who span { display: inline-block; border-bottom: 1.2px solid #111; }
    .sec { display: flex; justify-content: space-between; align-items: baseline; border-top: 2.5px solid #111; border-bottom: 1.2px solid #111; padding: 3px 2px; margin: 0 0 7px; font-weight: 700; font-size: 14.5pt; }
    .sec small { font-size: 10pt; font-weight: 400; }
    .sec + .ins { margin-top: 0; }
    .ins { margin: 11px 0 7px; }
    .ins .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; font-weight: 700; }
    .ins .pts { font-weight: 400; font-size: 11pt; white-space: nowrap; }
    .ins .tr { direction: rtl; text-align: right; font-size: 10pt; line-height: 1.35; color: #222; margin-top: 1px; }
    .ins .tr span { display: inline-block; margin-inline-end: 12px; }
    .sub { font-weight: 700; margin: 9px 0 4px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
    .sub .pts { font-weight: 400; font-size: 11pt; white-space: nowrap; }
    .sub .tr, .wlines .tr, .tr.inl { font-weight: 400; font-size: 10pt; color: #222; }

    ol.q { list-style: none; margin: 0; padding: 0; counter-reset: q; }
    ol.q > li { counter-increment: q; display: flex; gap: 6px; margin: 0 0 8px; align-items: baseline; }
    ol.q > li::before { content: counter(q) "."; min-width: 1.5em; }
    ol.q.abc > li::before { content: counter(q, lower-alpha) "."; }
    ol.q.loose > li { margin-bottom: 11px; }
    .blank { display: inline-block; min-width: 27mm; border-bottom: 1.3px solid #111; height: 1.05em; margin: 0 4px; vertical-align: baseline; }
    .blank.wide { min-width: 40mm; }
    .opts { display: inline-flex; flex-wrap: wrap; gap: 2px 9mm; }
    .opts.pair { gap: 0 3mm; font-weight: 700; }
    .right { margin-inline-start: auto; white-space: nowrap; }
    .tl { list-style: none; margin: 0; padding: 0 0 0 2em; }
    .tl li { display: flex; gap: 9px; align-items: center; margin: 0 0 5px; }
    .grow { flex: 1; }
    .stack { display: flex; flex-direction: column; gap: 3px; }

    .pics { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4mm; margin: 5px 0 2px; }
    .pic { border: 1.5px solid #111; border-radius: 6px; height: 27mm; display: flex; align-items: center; justify-content: center; font-size: 25pt; white-space: nowrap; }
    .pic.cake { gap: 5px; }
    .pic.cake b { font: 700 20pt Arial, sans-serif; }
    .numbox { width: 12mm; height: 11mm; border: 1.5px solid #111; margin: 4px auto 0; }
    .ticks { display: flex; gap: 9mm; }
    .tick { text-align: center; font-size: 22pt; line-height: 1.2; }
    .box { display: inline-block; width: 6mm; height: 6mm; border: 1.5px solid #111; vertical-align: middle; flex: none; }
    .tick .box { display: block; margin: 3px auto 0; }

    .match { display: flex; justify-content: space-between; gap: 20mm; padding: 0 6mm; }
    .match ol { flex: 1; }
    .match ol.q > li { margin-bottom: 7px; }
    .match .he { direction: rtl; font-size: 14pt; }
    .match .he li { display: flex; gap: 8px; align-items: center; margin: 0 0 4.5px; list-style: none; }
    .match ul { list-style: none; margin: 0; padding: 0; flex: 1; }
    .sq { display: inline-block; width: 9mm; height: 7.5mm; border: 1.5px solid #111; flex: none; }

    .bank { border: 1.5px solid #111; border-radius: 6px; padding: 6px 12px; display: flex; flex-wrap: wrap; gap: 4px 11mm; justify-content: center; font-weight: 700; margin: 6px 0 10px; }

    .halves { display: flex; gap: 12mm; }
    .halves > div { flex: 1; }
    .halves h4 { margin: 0 0 5px; font-size: 13pt; text-align: center; border-bottom: 1.2px solid #111; }
    .halves ol.q > li { align-items: center; margin-bottom: 9px; }

    .passage { border: 1.5px solid #111; border-radius: 4px; padding: 8px 16px 4px; font-size: 14pt; line-height: 1.62; margin: 6px 0 8px; }
    .passage h3 { margin: 0 0 3px; text-align: center; font-size: 15pt; }
    .passage p { margin: 0 0 6px; }

    /* two rows: the picture row stands on one ground line, the names sit under it */
    .scene { border: 1.5px solid #111; border-radius: 6px; padding: 6mm 4mm 3mm; margin: 6px 0 8px; display: grid; grid-template-rows: auto auto; grid-auto-flow: column; grid-auto-columns: auto; }
    .scene .up { display: flex; align-items: flex-end; justify-content: center; border-bottom: 1.5px solid #111; }
    .scene .up svg { display: block; }
    .scene .up.gap { min-width: 5mm; }   /* the space between two children takes what is left, so a thing stays by its owner */
    .scene .dn { text-align: center; font-weight: 700; font-size: 13pt; padding-top: 3px; }
    .scene .obj { font-size: 30pt; line-height: 1.05; }
    .scene .obj.held { padding-bottom: 29mm; margin-inline-start: -4mm; font-size: 24pt; }
    .wlines { list-style: none; margin: 0; padding: 0; counter-reset: w; }
    .wlines li { counter-increment: w; display: flex; align-items: flex-end; gap: 8px; height: 13.5mm; }
    .wlines li::before { content: counter(w) "."; min-width: 1.5em; }
    .wlines li::after { content: ""; flex: 1; border-bottom: 1.3px solid #111; }
    .wlines li.gap { height: auto; display: block; font-weight: 700; margin-top: 9px; counter-increment: none; }
    .wlines li.gap::before, .wlines li.gap::after { content: none; }

    /* the key and the coach's page */
    .key h2, .coach h2 { font-size: 13pt; margin: 9px 0 3px; border-bottom: 1.2px solid #111; padding-bottom: 2px; }
    .key .title, .coach .title { font-size: 19pt; margin: 0 0 2px; }
    .key { font-size: 11.5pt; line-height: 1.35; }
    .key .row { display: flex; flex-wrap: wrap; gap: 3px 9mm; margin: 2px 0; }
    .key .row b { font-weight: 700; }
    .key .n { display: inline-block; min-width: 1.4em; color: #333; }
    .key .he { direction: rtl; unicode-bidi: isolate; }
    .key .kpics { display: flex; gap: 5mm; margin: 4px 0; }
    .key .kpics div { border: 1.2px solid #111; border-radius: 5px; padding: 2px 7px; text-align: center; font-size: 15pt; }
    .key .kpics div b { display: block; font: 700 13pt Arial, sans-serif; }
    .key .kpics div i { font: 700 12pt Arial, sans-serif; }
    .key .checks { direction: rtl; text-align: right; margin: 5px 0 0; padding-inline-start: 22px; font-size: 12pt; line-height: 1.6; }
        .coach { direction: rtl; font-family: -apple-system, "Rubik", Arial, "Liberation Sans", sans-serif; font-size: 12pt; line-height: 1.55; }
    .coach ol, .coach ul { margin: 4px 0; padding-inline-start: 22px; }
    .coach li { margin-bottom: 3px; }
    .coach .en { direction: ltr; unicode-bidi: isolate; font-family: Arial, sans-serif; }
    .coach .script { direction: ltr; text-align: left; font-family: Arial, sans-serif; font-size: 12.5pt; line-height: 1.6; border: 1.2px solid #111; border-radius: 5px; padding: 6px 12px; margin: 4px 0; }
    .coach .script b { display: inline-block; min-width: 4.2em; }
    .coach table { border-collapse: collapse; width: 100%; margin-top: 4px; font-size: 11.5pt; }
    .coach th, .coach td { border: 1.2px solid #111; padding: 3px 8px; text-align: right; }
    .coach td.num, .coach th.num { text-align: center; width: 22mm; }
    .coach td:first-child { white-space: nowrap; }
    .coach td { padding: 6px 8px; }
    .coach .note { font-size: 11pt; color: #222; }
  </style>
</head>
<body class="v-test">
  <div class="bar" id="bar">
    <button data-view="test">המבחן</button>
    <button data-view="key">מפתח תשובות</button>
    <button data-view="coach">דף למאמן</button>
    <span class="sep"></span>
    <button data-play="a">🔊 האזנה א</button>
    <button data-play="b">🔊 האזנה ב</button>
    <button data-play="stop">■</button>
    <span class="sep"></span>
    <button id="print">הדפסה</button>
    <a id="back" href="index.html" hidden>חזרה למשחק</a>
    <span class="status" id="status"></span>
  </div>
  <main id="test"></main>
  <main id="key"></main>
  <main id="coach"></main>

  <script src="content.js?v=3.3.0"></script>
  <script>
  (function () {
    'use strict';
    const C = window.CONTENT, M = C.mock;
    const WORDS = Object.fromEntries(C.words.map(w => [w.id, w]));
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const abc = i => 'abcdefghij'[i];
    const sum = a => a.reduce((x, y) => x + y, 0);
    const blank = (t, wide) => esc(t).replace('___', `<span class="blank${wide ? ' wide' : ''}"></span>`);
    const emo = s => `<span class="emo">${s}</span>`;
    // a picture string: emoji, and a number where the picture has one (the cake)
    const picHtml = s => { const m = /^(\S+) (\d+)$/.exec(s); return m ? `<div class="pic cake">${emo(m[1])}<b>${m[2]}</b></div>` : `<div class="pic">${emo(s)}</div>`; };

    // ---------- points (the weights are content settings) ----------
    const L = M.listening, V = M.vocab, G = M.grammar, R = M.reading, W = M.writing, ST = R.story;
    const P = {
      lA: L.pics.pts * L.pics.items.length, lB: L.dialogue.pts * L.dialogue.questions.length,
      vA: V.match.pts * V.match.items.length, vB: V.bank.pts * V.bank.items.length,
      gA: G.be.pts * G.be.items.length, gB: G.circle.pts * G.circle.items.length, gC: G.have.pts * G.have.items.length,
      rA: R.halves.pts * R.halves.items.length, rB: sum(ST.questions.map(q => q.pts)),
      w: W.pts * (W.be + W.have),
    };
    const SEC = { l: P.lA + P.lB, v: P.vA + P.vB, g: P.gA + P.gB + P.gC, r: P.rA + P.rB, w: P.w };
    const TOTAL = sum(Object.values(SEC));

    // ---------- small builders ----------
    // an instruction in the test's three languages, with the points on the right
    const ins = (en, he, ar, pts) => `<div class="ins"><div class="l1"><span>${en}</span>${pts ? `<span class="pts">(${pts} points)</span>` : ''}</div><div class="tr"><span lang="he">${he}</span><span lang="ar">${ar}</span></div></div>`;
    const sec = (n, en, he, ar, pts) => `<div class="sec"><span>${n}. ${en} <small>· ${he} · ${ar}</small></span>${pts ? `<span>${pts} points</span>` : ''}</div>`;
    const page = (n, of, inner, cls) => `<section class="page ${cls || ''}">${inner}<div class="foot"><span>${esc(M.title)}</span><span>${n} / ${of}</span></div></section>`;
    const sub = (en, he, pts) => `<div class="sub"><span>${en} <span class="tr" dir="rtl">${he}</span></span><span class="pts">(${pts} points)</span></div>`;

    // a child for the writing picture: line art, so it prints the same on any printer.
    // The body and the legs carry the height; the head stays one size.
    function kidSvg(g, mood, size) {
      const T = { tall: 54, mid: 38, short: 25 }[size], Lg = { tall: 60, mid: 40, short: 24 }[size];
      const cx = 25, r = 13, hy = r + 4, sh = hy + r + 4, hip = sh + T, hem = g === 'f' ? hip + 6 : hip, foot = hip + Lg, H = foot + 3;
      const st = 'fill="none" stroke="#111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
      const hair = g === 'f'
        ? `<path d="M${cx - r - 2} ${hy + r + 8} Q${cx - r - 7} ${hy - r - 7} ${cx} ${hy - r - 3} Q${cx + r + 7} ${hy - r - 7} ${cx + r + 2} ${hy + r + 8} L${cx + r - 5} ${hy + r} L${cx - r + 5} ${hy + r}Z" fill="#111"/>` : '';
      const fringe = g === 'f'
        ? `<path d="M${cx - r + 1} ${hy - 4} Q${cx} ${hy - r - 2} ${cx + r - 1} ${hy - 4} Q${cx} ${hy - 9} ${cx - r + 1} ${hy - 4}Z" fill="#111"/>`
        : `<path d="M${cx - r} ${hy - 3} A${r} ${r} 0 0 1 ${cx + r} ${hy - 3} Q${cx + 3} ${hy - 9} ${cx - r} ${hy - 3}Z" fill="#111"/>`;
      const eyes = `<circle cx="${cx - 5}" cy="${hy - 1}" r="1.7" fill="#111"/><circle cx="${cx + 5}" cy="${hy - 1}" r="1.7" fill="#111"/>`;
      const mouth = mood === 'happy' ? `<path d="M${cx - 7} ${hy + 4} Q${cx} ${hy + 13} ${cx + 7} ${hy + 4}Z" fill="#fff" ${st.replace('fill="none"', '')}/>`
        : mood === 'sad' ? `<path d="M${cx - 5.5} ${hy + 9} Q${cx} ${hy + 3.5} ${cx + 5.5} ${hy + 9}" ${st}/><path d="M${cx + 8} ${hy + 1.5} q-2 3.8 0 4.8 q2 -1 0 -4.8Z" fill="#111"/>`
        : `<path d="M${cx - 4} ${hy + 6} L${cx + 4} ${hy + 6}" ${st}/>`;
      const body = g === 'f'
        ? `<path d="M${cx - 8} ${sh} L${cx + 8} ${sh} L${cx + 16} ${hem} L${cx - 16} ${hem}Z" fill="#fff" ${st.replace('fill="none"', '')}/>`
        : `<rect x="${cx - 10}" y="${sh}" width="20" height="${T}" rx="4" fill="#fff" ${st.replace('fill="none"', '')}/>`;
      const legs = `<path d="M${cx - 5} ${hem} L${cx - 6} ${foot} l-5 0M${cx + 5} ${hem} L${cx + 6} ${foot} l5 0" ${st}/>`;
      const sx = g === 'f' ? 8 : 10;
      const arms = mood === 'happy'
        ? `<path d="M${cx - sx} ${sh + 4} L${cx - 23} ${sh - 11}M${cx + sx} ${sh + 4} L${cx + 23} ${sh - 11}" ${st}/>`
        : `<path d="M${cx - sx} ${sh + 4} L${cx - 20} ${sh + T * 0.72}M${cx + sx} ${sh + 4} L${cx + 20} ${sh + T * 0.72}" ${st}/>`;
      const neck = `<path d="M${cx} ${hy + r} L${cx} ${sh}" ${st}/>`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 ${H}" width="${50 * 0.42}mm" height="${H * 0.42}mm" aria-hidden="true">${hair}${neck}${arms}${legs}${body}<circle cx="${cx}" cy="${hy}" r="${r}" fill="#fff" ${st.replace('fill="none"', '')}/>${fringe}${eyes}${mouth}</svg>`;
    }
    // one child or one thing is a column of the picture: what stands on the ground, and the name under it
    const col = (up, dn, cls) => `<div class="up ${cls || ''}">${up}</div><div class="dn">${dn || ''}</div>`;
    function figHtml(f) {
      const kid = i => col(kidSvg(f.g[i], f.mood, f.size), esc(f.who[i]));
      const obj = col(`<span class="obj emo${f.has === 'book' ? ' held' : ''}">${f.e}</span>`);
      return kid(0) + obj + (f.who.length > 1 ? kid(1) : '');
    }
    const names = f => f.who.join(' and ');
    const beSentence = f => `${names(f)} ${f.who.length > 1 ? 'are' : 'is'} ${f.adj}.`;
    const haveSentence = f => `${names(f)} ${f.who.length > 1 ? 'have' : 'has'} a ${f.has}.`;

    // a reading or listening question, as printed
    function qHtml(q, lab = abc) {
      if (q.type === 'tf') return `<span class="grow">${esc(q.en)}</span><span class="right opts pair">True&nbsp; / &nbsp;False</span>`;
      if (q.type === 'yn') return `<span class="grow">${esc(q.en)}</span><span class="right opts pair">Yes&nbsp; / &nbsp;No</span>`;
      if (q.type === 'mc' || q.type === 'fact' || q.type === 'complete') {
        const stem = q.type === 'complete' ? esc(q.en) + ' …' : esc(q.en);
        return `<span class="stack grow"><span>${stem}</span><span class="opts">${q.choices.map((c, i) => `<span>${lab(i)}. ${esc(c.en)}</span>`).join('')}</span></span>`;
      }
      return esc(q.en);
    }
    const num = i => i + 1;
    const qKey = (q, lab = abc) => q.type === 'tf' ? (q.ok ? 'True' : 'False') : q.type === 'yn' ? (q.ok ? 'Yes' : 'No')
      : q.choices ? q.choices.map((c, i) => c.ok ? `${lab(i)}. ${esc(c.en)}` : '').filter(Boolean).join(' · ') : '';

    // ---------- the test: five pages ----------
    function renderTest() {
      const dq = L.dialogue.questions, plain = dq.filter(q => q.type !== 'tick2'), tick = dq.find(q => q.type === 'tick2');
      const p1 = `
        <div class="head"><h1>${esc(M.title)}</h1><div class="who"><span>Name: <span style="min-width:48mm">&nbsp;</span></span><span>Class: <span style="min-width:16mm">&nbsp;</span></span></div></div>
        ${sec(1, 'Listening', 'האזנה', 'الاستماع', SEC.l)}
        ${ins('A. Listen. Write the numbers 1–' + L.pics.items.length + ' under the pictures.', 'הקשיבו. כתבו את המספרים 1–' + L.pics.items.length + ' מתחת לתמונות.', 'استمعوا واكتبوا الأرقام 1–' + L.pics.items.length + ' تحت الصور.', P.lA)}
        <div class="pics">${L.pics.order.map(n => `<div>${picHtml(L.pics.items[n - 1].pic)}<div class="numbox"></div></div>`).join('')}</div>
        ${ins(`B. Listen to ${esc(L.dialogue.who.a)} and ${esc(L.dialogue.who.b)}. Circle the right answers.`, 'הקשיבו ליעל ולנועם. הקיפו את התשובות הנכונות.', 'استمعوا إلى ياعيل ونوعام. ضعوا دائرة حول الإجابات الصحيحة.', P.lB)}
        <ol class="q loose">${plain.map(q => `<li>${qHtml(q)}</li>`).join('')}
          <li><span class="stack grow"><span>${esc(tick.en)}</span><span class="tr inl" dir="rtl">סמנו ✓ מתחת לשתי התמונות הנכונות. · ضعوا إشارة ✓ تحت الصورتين الصحيحتين.</span><span class="ticks">${tick.choices.map(c => `<span class="tick">${emo(c.e)}<span class="box"></span></span>`).join('')}</span></span></li>
        </ol>`;

      const p2 = `
        ${sec(2, 'Vocabulary', 'אוצר מילים', 'المفردات', SEC.v)}
        ${ins('A. Match. Write the number of the English word next to the Hebrew word.', 'כתבו את מספר המילה באנגלית ליד המילה בעברית.', 'اكتبوا رقم الكلمة الإنجليزية بجانب الكلمة بالعبرية.', P.vA)}
        <div class="match">
          <ol class="q">${V.match.items.map(id => `<li>${esc(WORDS[id].en)}</li>`).join('')}</ol>
          <ul class="he">${V.match.order.map(n => `<li><span class="sq"></span><span>${esc(WORDS[V.match.items[n - 1]].he)}</span></li>`).join('')}</ul>
        </div>
        ${ins('B. Complete the sentences. Use the words in the box.', 'השלימו את המשפטים בעזרת המילים שבמסגרת.', 'أكملوا الجمل بالكلمات التي في الإطار.', P.vB)}
        <div class="bank">${V.bank.order.map(n => `<span>${esc(V.bank.items[n - 1].a)}</span>`).join('')}</div>
        <ol class="q loose">${V.bank.items.map(it => `<li><span>${blank(it.t, true)}</span></li>`).join('')}</ol>
        ${sec(3, 'Grammar', 'דקדוק', 'القواعد', SEC.g)}
        ${ins('A. Write <u>am</u>, <u>is</u> or <u>are</u>.', 'כתבו am, is או are.', 'اكتبوا am أو is أو are.', P.gA)}
        <ol class="q loose">${G.be.items.map(it => `<li><span>${blank(it.t)}</span></li>`).join('')}</ol>`;

      const p3 = `
        ${sec(3, 'Grammar', 'דקדוק', 'القواعد')}
        ${ins('B. Circle the right words.', 'הקיפו את המילים הנכונות.', 'ضعوا دائرة حول الكلمات الصحيحة.', P.gB)}
        <ol class="q loose">${G.circle.items.map(it => `<li><span>${esc(it.t).replace('___', `<span class="opts pair">( ${esc(it.o[0])} &nbsp;/&nbsp; ${esc(it.o[1])} )</span>`)}</span></li>`).join('')}</ol>
        ${ins('C. Write <u>have</u> or <u>has</u>.', 'כתבו have או has.', 'اكتبوا have أو has.', P.gC)}
        <ol class="q loose">${G.have.items.map(it => `<li><span>${blank(it.t)}</span></li>`).join('')}</ol>
        ${sec(4, 'Reading', 'הבנת הנקרא', 'فهم المقروء', SEC.r)}
        ${ins('A. Match A to B. Write the letter in the box.', 'התאימו בין A ל-B. כתבו את האות במשבצת.', 'لائموا بين A و B. اكتبوا الحرف في المربع.', P.rA)}
        <div class="halves">
          <div><h4>A</h4><ol class="q">${R.halves.items.map(it => `<li><span class="grow">${esc(it.a)}</span><span class="sq"></span></li>`).join('')}</ol></div>
          <div><h4>B</h4><ol class="q abc">${R.halves.order.map(n => `<li><span>${esc(R.halves.items[n - 1].b)}</span></li>`).join('')}</ol></div>
        </div>`;

      const by = t => ST.questions.filter(q => q.type === t);
      const w2 = by('write2')[0], tfs = by('tf'), mcs = ST.questions.filter(q => q.type === 'complete' || q.type === 'fact'), t2 = by('tick2')[0];
      const p4 = `
        ${sec(4, 'Reading', 'הבנת הנקרא', 'فهم المقروء')}
        ${ins('B. Read the text. Answer the questions.', 'קראו את הקטע וענו על השאלות.', 'اقرأوا النص وأجيبوا عن الأسئلة.', P.rB)}
        <div class="passage"><h3>${esc(ST.title)}</h3>${ST.paras.map(p => `<p>${p.map(i => esc(ST.sentences[i].en)).join(' ')}</p>`).join('')}</div>
        ${sub('1. ' + esc(w2.en), 'כתבו שני דברים.', w2.pts)}
        <ol class="q abc loose"><li><span class="blank grow"></span></li><li><span class="blank grow"></span></li></ol>
        ${sub('2. Circle True or False.', 'הקיפו True או False.', sum(tfs.map(q => q.pts)))}
        <ol class="q abc">${tfs.map(q => `<li>${qHtml(q)}</li>`).join('')}</ol>
        ${sub('3. Circle the right answer.', 'הקיפו את התשובה הנכונה.', sum(mcs.map(q => q.pts)))}
        <ol class="q abc">${mcs.map(q => `<li>${qHtml(q, num)}</li>`).join('')}</ol>
        ${sub('4. ' + esc(t2.en).replace('Tick', 'Tick (✓)'), 'סמנו ✓ ליד שני המשפטים הנכונים.', t2.pts)}
        <ul class="tl">${t2.choices.map(c => `<li><span class="box"></span><span>${esc(c.en)}</span></li>`).join('')}</ul>`;

      const p5 = `
        ${sec(5, 'Writing', 'כתיבה', 'الكتابة', SEC.w)}
        ${ins(`Look at the picture. Write ${W.be + W.have} sentences about the children. Use the words in the box.`, 'הסתכלו בתמונה. כתבו חמישה משפטים על הילדים. היעזרו במילים שבמסגרת.', 'انظروا إلى الصورة. اكتبوا خمس جمل عن الأولاد. استعينوا بالكلمات التي في الإطار.', P.w)}
        <div class="scene" style="grid-template-columns:${W.figs.map(f => `repeat(${f.who.length + 1}, max-content)`).join(' 1fr ')}">${W.figs.map(figHtml).join(col('', '', 'gap'))}</div>
        <div class="bank">${W.bank.map(w => `<span>${esc(w)}</span>`).join('')}</div>
        <ol class="wlines">
          <li class="gap">Write ${W.be} sentences with <u>is</u> or <u>are</u>. <span class="tr" dir="rtl">שני משפטים עם is או are · جملتان مع is أو are</span></li>
          ${'<li></li>'.repeat(W.be)}
          <li class="gap">Write ${W.have} sentences with <u>have</u> or <u>has</u>. <span class="tr" dir="rtl">שלושה משפטים עם have או has · ثلاث جمل مع have أو has</span></li>
          ${'<li></li>'.repeat(W.have)}
        </ol>`;

      const pages = [p1, p2, p3, p4, p5];
      document.getElementById('test').innerHTML = pages.map((p, i) => page(i + 1, pages.length, p)).join('');
    }

    // ---------- the key: what he checks his sheet against, with the coach beside him ----------
    function renderKey() {
      const dq = L.dialogue.questions, plain = dq.filter(q => q.type !== 'tick2'), tick = dq.find(q => q.type === 'tick2');
      const row = (items, lead) => `<div class="row">${lead ? `<b>${lead}</b>` : ''}${items.map((x, i) => `<span><span class="n">${i + 1}.</span> <b>${x}</b></span>`).join('')}</div>`;
      const by = t => ST.questions.filter(q => q.type === t);
      const w2 = by('write2')[0], tfs = by('tf'), mcs = ST.questions.filter(q => q.type === 'complete' || q.type === 'fact'), t2 = by('tick2')[0];
      const html = `
        <h1 class="title">${esc(M.title)} · Answers</h1>
        <div class="he" style="font-size:12pt">בודקים ביחד, משפט אחרי משפט.</div>
        <h2>1. Listening</h2>
        <div><b>A.</b> the pictures, left to right:</div>
        <div class="kpics">${L.pics.order.map(n => `<div>${L.pics.items[n - 1].pic.replace(/^(\S+)( \d+)?$/, (m, e, d) => emo(e) + (d ? `<i>${d}</i>` : ''))}<b>${n}</b></div>`).join('')}</div>
        ${row(plain.map(q => qKey(q)).concat([tick.choices.filter(c => c.ok).map(c => `${emo(c.e)} ${esc(c.en)}`).join(' + ')]), 'B.')}
        <h2>2. Vocabulary</h2>
        <div><b>A.</b> the Hebrew words, top to bottom:</div>
        <div class="row">${V.match.order.map(n => `<span><b>${n}</b> <span class="he">${esc(WORDS[V.match.items[n - 1]].he)}</span></span>`).join('')}</div>
        ${row(V.bank.items.map(it => esc(it.a)), 'B.')}
        <h2>3. Grammar</h2>
        ${row(G.be.items.map(it => esc(it.a)), 'A.')}
        ${row(G.circle.items.map(it => esc(it.a)), 'B.')}
        ${row(G.have.items.map(it => esc(it.a)), 'C.')}
        <h2>4. Reading</h2>
        <div><b>A.</b></div>
        <div class="row">${R.halves.items.map((it, i) => `<span><span class="n">${i + 1}.</span> <b>${abc(R.halves.order.indexOf(i + 1))}</b> &nbsp;${esc(it.a)} ${esc(it.b)}</span>`).join('')}</div>
        <div><b>B.</b></div>
        <div class="row"><span><span class="n">1.</span> <b>${w2.model.map(esc).join('</b> &nbsp;·&nbsp; <b>')}</b></span></div>
        <div class="row"><span><span class="n">2.</span> ${tfs.map((q, i) => `${abc(i)}. <b>${qKey(q)}</b>`).join(' &nbsp; ')}</span></div>
        <div class="row"><span><span class="n">3.</span> ${mcs.map((q, i) => `${abc(i)}. <b>${qKey(q, num)}</b>`).join(' &nbsp; ')}</span></div>
        <div class="row"><span><span class="n">4.</span> <b>${t2.choices.filter(c => c.ok).map(c => esc(c.en)).join('</b> &nbsp;·&nbsp; <b>')}</b></span></div>
        <h2>5. Writing</h2>
        <div><u>is</u> / <u>are</u> · any ${W.be}:</div>
        <div class="row">${W.figs.map(f => `<b>${esc(beSentence(f))}</b>`).join('')}</div>
        <div><u>have</u> / <u>has</u> · any ${W.have}:</div>
        <div class="row">${W.figs.map(f => `<b>${esc(haveSentence(f))}</b>`).join('')}</div>
        <ol class="checks">
          <li>השם ראשון, באות גדולה.</li>
          <li>המילה הקטנה הנכונה: ילד אחד מקבל <span class="en">is</span> / <span class="en">has</span>, שני ילדים מקבלים <span class="en">are</span> / <span class="en">have</span>.</li>
          <li>כל מילה מהמסגרת מועתקת בדיוק, ונקודה בסוף.</li>
        </ol>`;
      document.getElementById('key').innerHTML = `<section class="page key">${html}</section>`;
    }

    // ---------- the coach's page: how to run it, the listening text, the points ----------
    function renderCoach() {
      const nums = ['one', 'two', 'three', 'four', 'five', 'six'];
      const tr = (name, how, pts) => `<tr><td>${name}</td><td>${how}</td><td class="num">${pts}</td><td class="num"></td></tr>`;
      const by = t => ST.questions.filter(q => q.type === t);
      const html = `
        <h1 class="title">דף למאמן</h1>
        <div class="note">מבחן לדוגמה במבנה של עותק התרגול: חמישה חלקים, ${TOTAL} נקודות. כל התוכן חדש: השמות, התמונה, הקטע והשיחה.</div>
        <h2>איך מריצים</h2>
        <ol>
          <li>מדפיסים את חמשת עמודי המבחן: הכפתור "המבחן" ואז "הדפסה", על דפי A4. המפתח והדף הזה מודפסים בנפרד, או נשארים על המסך.</li>
          <li>עט, שולחן שקט, והמסך לא מולו. בלי שעון.</li>
          <li>מתחילים בהאזנה. הכפתורים "האזנה א" ו"האזנה ב" משמיעים כל חלק פעמיים, בקול של המכשיר. אם הקולות לא ברורים, קוראים בקול את הטקסט שלמטה, פעמיים, בקצב רגיל.</li>
          <li>בשאר החלקים לא מקריאים ולא מתרגמים.</li>
          <li>בסוף בודקים ביחד מול "מפתח תשובות": הוא מסמן על הדף שלו, ואתם לצידו.</li>
        </ol>
        <div class="note"><b>בלי מדפסת:</b> פותחים את "המבחן" על האייפד והוא כותב את התשובות על דף רגיל. את קטע הקריאה (עמוד 4) כדאי להעתיק ביד לדף, כי שם הקריאה מהנייר חשובה במיוחד.</div>
        <h2>האזנה א</h2>
        <div class="script">${L.pics.items.map((it, i) => `<div><b>Number ${nums[i]}.</b> ${esc(it.say)}</div>`).join('')}</div>
        <h2>האזנה ב</h2>
        <div class="script">${L.dialogue.lines.map(l => `<div><b>${esc(L.dialogue.who[l.who])}:</b> ${esc(l.en)}</div>`).join('')}</div>
</section><section class="page coach" lang="he">
        <h1 class="title">ניקוד</h1>
        <div class="note">הדף הזה נשאר אצלכם.</div>
        <table>
          <tr><th>חלק</th><th>איך סופרים</th><th class="num">נקודות</th><th class="num">שלו</th></tr>
          ${tr('<span class="en">Listening A</span>', `${L.pics.items.length} תמונות, ${L.pics.pts} לכל אחת`, P.lA)}
          ${tr('<span class="en">Listening B</span>', `${L.dialogue.questions.length} שאלות, ${L.dialogue.pts} לכל אחת (בשאלת התמונות: 1 לכל תמונה נכונה)`, P.lB)}
          ${tr('<span class="en">Vocabulary A</span>', `${V.match.items.length} מילים, ${V.match.pts} לכל אחת`, P.vA)}
          ${tr('<span class="en">Vocabulary B</span>', `${V.bank.items.length} משפטים, ${V.bank.pts} לכל אחד. המילה מועתקת בדיוק כמו במסגרת (<span class="en">begins</span>, לא <span class="en">begin</span>)`, P.vB)}
          ${tr('<span class="en">Grammar A</span>', `${G.be.items.length} משפטים, ${G.be.pts} לכל אחד`, P.gA)}
          ${tr('<span class="en">Grammar B</span>', `${G.circle.items.length} משפטים, ${G.circle.pts} לכל אחד`, P.gB)}
          ${tr('<span class="en">Grammar C</span>', `${G.have.items.length} משפטים, ${G.have.pts} לכל אחד`, P.gC)}
          ${tr('<span class="en">Reading A</span>', `${R.halves.items.length} משפטים, ${R.halves.pts} לכל אחד`, P.rA)}
          ${tr('<span class="en">Reading B</span>', `שאלה 1: ${by('write2')[0].pts / 2} לכל דבר · שאלה 2: ${by('tf')[0].pts} לכל משפט · שאלה 3: 2 לכל תשובה · שאלה 4: ${by('tick2')[0].pts / 2} לכל סימון נכון`, P.rB)}
          ${tr('<span class="en">Writing</span>', `${W.be + W.have} משפטים, ${W.pts} לכל משפט ששלוש הבדיקות שבמפתח עוברות בו`, P.w)}
          <tr><th colspan="2">סך הכול</th><th class="num">${TOTAL}</th><th class="num"></th></tr>
        </table>`;
      document.getElementById('coach').innerHTML = `<section class="page coach" lang="he">${html}</section>`;
    }

    // ---------- views ----------
    const VIEWS = ['test', 'key', 'coach'];
    function setView(v) {
      if (!VIEWS.includes(v)) v = 'test';
      document.body.className = 'v-' + v;
      document.querySelectorAll('#bar [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
      document.title = v === 'test' ? M.title : v === 'key' ? M.title + ' · Answers' : M.title + ' · Coach';
    }
    // on a screen narrower than a sheet (an iPad held upright is just wide enough), the sheets shrink to fit
    function fit() {
      const sheet = document.querySelector('.page'); if (!sheet) return;
      const w = 210 * 96 / 25.4 + 24, z = Math.min(1, window.innerWidth / w);
      document.querySelectorAll('main').forEach(m => { m.style.zoom = z < 1 ? z : ''; });
    }

    // ---------- the listening, in the device's voices (as the game speaks its dialogues) ----------
    const Say = {
      v1: null, v2: null, run: 0,
      ok: () => 'speechSynthesis' in window,
      pick() {
        if (!this.ok()) return;
        const vs = speechSynthesis.getVoices(); if (!vs.length) return;
        const pref = ['Samantha', 'Google US English', 'Alex', 'Ava', 'Allison'];
        this.v1 = vs.find(v => pref.includes(v.name) && v.lang.startsWith('en')) || vs.find(v => v.lang === 'en-US') || vs.find(v => v.lang.startsWith('en')) || null;
        const pref2 = ['Daniel', 'Google UK English Male', 'Alex', 'Tom', 'Aaron', 'Fred'];
        const other = v => v.lang.startsWith('en') && (!this.v1 || v.name !== this.v1.name);
        this.v2 = vs.find(v => pref2.includes(v.name) && other(v)) || vs.find(v => v.lang === 'en-GB' && other(v)) || null;
      },
      // one line; resolves when it has been said (or after 12 s, if the device never reports the end)
      line(text, who) {
        return new Promise(res => {
          let done = false; const fin = () => { if (!done) { done = true; res(); } };
          try {
            const u = new SpeechSynthesisUtterance(text);
            u.lang = 'en-US'; u.rate = 0.9; u.pitch = 1;
            if (who === 'b' && this.v2) { u.voice = this.v2; u.lang = this.v2.lang; }
            else { if (this.v1) u.voice = this.v1; if (who === 'b') u.pitch = 0.6; }
            u.onend = u.onerror = fin;
            speechSynthesis.speak(u);
          } catch (e) { fin(); }
          setTimeout(fin, 12000);
        });
      },
      stop() { this.run++; try { if (this.ok()) speechSynthesis.cancel(); } catch (e) { /* ignore */ } },
    };
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const status = t => { document.getElementById('status').textContent = t; };
    async function play(part) {
      Say.stop();
      if (part === 'stop') return status('');
      if (!Say.ok()) return status('אין קול במכשיר הזה. הטקסט נמצא ב"דף למאמן".');
      Say.pick();
      const my = Say.run, live = () => my === Say.run, name = part === 'a' ? 'האזנה א' : 'האזנה ב';
      const nums = ['one', 'two', 'three', 'four', 'five', 'six'];
      for (let pass = 1; pass <= 2 && live(); pass++) {
        status(`${name} · השמעה ${pass} מתוך 2`);
        if (part === 'a') {
          for (let i = 0; i < L.pics.items.length && live(); i++) {
            await Say.line(`Number ${nums[i]}.`); await wait(500); if (!live()) return;
            await Say.line(L.pics.items[i].say); await wait(3500); if (!live()) return;
          }
        } else {
          for (const l of L.dialogue.lines) { await Say.line(l.en, l.who); await wait(600); if (!live()) return; }
        }
        if (pass === 1) await wait(4000);
      }
      if (live()) status(`${name} · הסתיים`);
    }
    if (Say.ok()) speechSynthesis.onvoiceschanged = () => Say.pick();

    // ---------- start ----------
    renderTest(); renderKey(); renderCoach();
    setView(new URLSearchParams(location.search).get('view') || 'test');
    fit(); window.addEventListener('resize', fit);
    document.getElementById('bar').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.view) setView(b.dataset.view);
      else if (b.dataset.play) play(b.dataset.play);
      else if (b.id === 'print') { Say.stop(); status(''); window.print(); }
    });
    // Opened from the game on the home screen there is no browser around the page, so it needs its own way back.
    // In a browser the link stays hidden: there, index.html would be a different save (the home-screen game keeps its own).
    if (navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches)) document.getElementById('back').hidden = false;
    window.__mock = { play, Say, setView, P, SEC, TOTAL };
  })();
  </script>
</body>
</html>
