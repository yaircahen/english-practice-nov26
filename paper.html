<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Chapter 1</title>
  <!--
    The printed papers (prd.md §6.4, v4.1): the teacher's shape, seven tasks and a bonus, content from papers.js.
    A paper is its own sitting, at a table, with a pen and no iPad. Three views, each printed on its own:
    the paper (5 pages, A4), the key, one page for the coach.
    Open with ?n=1&view=test | key | coach.
  -->
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #7d828c; color: #111; font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", Arial, sans-serif; }
    .he { direction: rtl; font-family: Arial, "Rubik", sans-serif; unicode-bidi: isolate; }
    .bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 14px; background: #20232b; color: #fff; direction: rtl; font-family: -apple-system, "Rubik", Arial, sans-serif; }
    .bar button { font: inherit; font-size: 16px; padding: 8px 14px; border-radius: 8px; border: 1px solid #5a6070; background: #2f3440; color: #fff; cursor: pointer; }
    .bar button[aria-pressed="true"] { background: #fff; color: #111; border-color: #fff; }
    .bar .sep { align-self: stretch; width: 1px; background: #555b68; margin: 0 4px; }
    main { display: none; }
    body.v-test #test, body.v-key #key, body.v-coach #coach { display: block; }
    .page { width: 210mm; min-height: 297mm; margin: 8mm auto; padding: 14mm 17mm; background: #fff; box-shadow: 0 2px 10px rgba(0, 0, 0, .35); position: relative; font-size: 15pt; line-height: 1.35; }
    .foot { position: absolute; bottom: 7mm; right: 17mm; font-size: 10pt; }
    @page { size: A4; margin: 0; }
    @media print {
      body { background: #fff; }
      .bar { display: none; }
      .page { margin: 0; box-shadow: none; min-height: 0; height: 296mm; overflow: hidden; break-after: page; }
      .page:last-child { break-after: auto; }
    }
    .who { display: flex; gap: 6mm; justify-content: center; margin-bottom: 4mm; }
    .who i { display: inline-block; border-bottom: 1.5px solid #111; width: 55mm; }
    h1 { text-align: center; font-size: 17pt; margin: 0 0 7mm; font-weight: 400; text-decoration: underline; }
    .task { display: flex; justify-content: space-between; align-items: baseline; gap: 6mm; margin: 0 0 5mm; font-weight: 700; text-decoration: underline; font-size: 15.5pt; }
    .task .he { font-size: 13.5pt; }
    .pts { text-align: right; font-size: 12pt; margin: 2mm 0 7mm; }
    ol.items { margin: 0; padding-left: 9mm; }
    ol.items li { margin-bottom: 5.2mm; padding-left: 2mm; }
    ol.items.roomy li { margin-bottom: 4.6mm; }
    .tight .pts { margin: 1mm 0 4mm; }
    .tight .task { margin-bottom: 4mm; }
    .gap { display: inline-block; border-bottom: 1.5px solid #111; width: 36mm; height: 1em; vertical-align: baseline; margin: 0 1.5mm; }
    .gap.wide { width: 48mm; }
    table { border-collapse: collapse; width: 100%; }
    td, th { border: 1.5px solid #111; padding: 2mm 3mm; font-weight: 400; }
    table.bank td { width: 20%; height: 11mm; vertical-align: middle; }
    table.sort th { text-align: center; }
    table.sort td { height: 10.5mm; }
    .tight table.sort td { height: 8.6mm; }
    .tight table.words td { height: 8.6mm; }
    table.words td { text-align: center; height: 9.5mm; }
    .story p { margin: 0 0 1mm; font-size: 15pt; line-height: 1.5; }
    .qs { margin-top: 6mm; }
    .qs .q { margin-bottom: 3mm; }
    .line { border-bottom: 1.5px solid #111; height: 9mm; margin-left: 9mm; }
    .line.num { display: flex; align-items: flex-end; border: 0; gap: 2mm; }
    .line.num i { flex: 1; border-bottom: 1.5px solid #111; height: 9.5mm; }
    u { text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
    .bonus { font-size: 20pt; font-weight: 700; margin: 0 0 3mm; }
    /* key and coach */
    .plain { font-family: Arial, "Rubik", sans-serif; font-size: 12pt; line-height: 1.4; }
    .plain.coach { font-size: 11pt; line-height: 1.35; padding-top: 10mm; }
    .plain.coach h2 { font-size: 13pt; margin: 4mm 0 1.5mm; }
    .plain h2 { font-size: 15pt; margin: 6mm 0 2mm; }
    .plain h1 { text-decoration: none; font-weight: 700; }
    .plain ol, .plain ul { margin: 0; padding-inline-start: 7mm; }
    .plain b.ans { text-decoration: underline; }
    .plain .cols { columns: 2; column-gap: 10mm; }
    .plain .note { color: #333; font-size: 11pt; }
    .coach { direction: rtl; }
    .coach li { margin-bottom: 2mm; }
    .coach table td { font-size: 12pt; }
    .coach .en { direction: ltr; unicode-bidi: isolate; font-weight: 700; }
    .say { border-inline-start: 4px solid #111; padding: 1mm 4mm; margin: 2mm 0; }
  </style>
</head>
<body class="v-test">
  <div class="bar" id="bar">
    <span id="pick"></span>
    <span class="sep"></span>
    <button data-view="test">הדף</button>
    <button data-view="key">תשובות</button>
    <button data-view="coach">למאמן</button>
    <span class="sep"></span>
    <button id="print">🖨️ הדפסה</button>
  </div>
  <main id="test"></main>
  <main id="key"></main>
  <main id="coach"></main>
  <script src="papers.js?v=4"></script>
  <script>
  (function () {
    const D = window.PAPERS, qs = new URLSearchParams(location.search);
    const P = D.papers.find(p => String(p.n) === (qs.get('n') || '1')) || D.papers[0];
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const gap = (t, cls) => esc(t).replace(/___/g, `<span class="gap ${cls || ''}"></span>`);
    const fill = (t, a) => { let i = 0; const arr = [].concat(a); return esc(t).replace(/___/g, () => `<b class="ans">${esc(arr[i++])}</b>`); };
    const und = t => esc(t).replace(/\[(.+?)\]/g, '<u>$1</u>');
    // a fixed shuffle, so a reprint is the same sheet: seeded by the paper's number
    function mix(arr, salt) { let s = P.n * 9301 + salt * 49297; const r = () => (s = (s * 233280 + 12345) % 2147483647) / 2147483647; const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
    const rows = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out; };
    const page = (n, html, cls) => `<section class="page ${cls || ''}">${html}<div class="foot">${n}</div></section>`;
    const task = (letter, en, he) => `<div class="task"><span>${letter}. ${en}</span><span class="he">${he}</span></div>`;

    const bankWords = mix([...P.A.items.flatMap(x => x.a.map(w => w.toLowerCase())), ...P.A.spare], 1);
    const eWords = mix([...P.E.a, ...P.E.an, ...P.E.some], 2);
    const fCols = ['It', 'She', 'They', 'We', 'You', 'He'];
    const fWords = mix(fCols.flatMap(c => P.F[c]), 3);
    const blanks = P.A.items.reduce((n, x) => n + x.a.length, 0);

    function renderTest() {
      const p1 = `
        <div class="who"><span>Name:<i></i></span><span>Date:<i></i></span></div>
        <h1>Hey – Chapter 1 (${P.n})</h1>
        ${task('A', 'Complete the sentences:', 'השלם את המשפטים')}
        <ol class="items">${P.A.items.map(x => `<li>${gap(x.t)}</li>`).join('')}</ol>
        <table class="bank" style="margin-top:5mm">${rows(bankWords, 5).map(r => `<tr>${r.map(w => `<td>${esc(w)}</td>`).join('')}</tr>`).join('')}</table>
        <div class="pts">(${blanks}x1)</div>`;
      const p2 = `
        ${task('B', 'Complete with: am, is, are', 'השלם עם')}
        <ol class="items roomy">${P.B.map(x => `<li>${gap(x.t)}</li>`).join('')}</ol><div class="pts">(5x2)</div>
        ${task('C', 'Complete with: have, has', 'השלם עם')}
        <ol class="items roomy">${P.C.map(x => `<li>${gap(x.t)}</li>`).join('')}</ol><div class="pts">(5x2)</div>
        ${task('D', 'Put the words in the right column:', 'הכנס את המילים לטור המתאים')}
        <table class="sort"><tr><th>a</th><th>an</th><th>some</th></tr>${[1, 2, 3, 4, 5].map(() => '<tr><td></td><td></td><td></td></tr>').join('')}</table>
        <table class="words" style="margin-top:5mm">${rows(eWords, 5).map(r => `<tr>${r.map(w => `<td>${esc(w)}</td>`).join('')}</tr>`).join('')}</table>
        <div class="pts">(10x1)</div>`;
      const p3 = `
        ${task('E', 'Put the words in the right place:', 'מיין את המילים לטור המתאים')}
        <table class="sort"><tr>${fCols.map(c => `<th>${c}</th>`).join('')}</tr>${[1, 2, 3, 4, 5, 6].map(() => `<tr>${fCols.map(() => '<td></td>').join('')}</tr>`).join('')}</table>
        <table class="words" style="margin-top:7mm">${rows(fWords, 5).map(r => `<tr>${r.map(w => `<td>${esc(w)}</td>`).join('')}</tr>`).join('')}</table>
        <div class="pts">(20x1)</div>`;
      const p4 = `
        ${task('F', 'Read the story', 'קרא את הסיפור וענה על השאלות')}
        <div class="story">${P.G.paras.map(x => `<p>${esc(x)}</p>`).join('')}</div>
        <div class="qs"><div class="task" style="margin-bottom:3mm"><span>Write the answers:</span><span class="he">כתוב את התשובה המלאה</span></div>
        ${P.G.qs.map((q, i) => `<div class="q">${i + 1}. ${esc(q.q)}${q.two ? '<div class="line num">1.<i></i></div><div class="line num">2.<i></i></div>' : '<div class="line"></div><div class="line"></div>'}</div>`).join('')}</div>
        <div class="pts">(5x3)</div>`;
      const p5 = `
        <div class="bonus">Bonus:</div>
        <table class="words">${rows([...D.whBank, ''], 4).map(r => `<tr>${r.map(w => `<td style="text-align:left">${esc(w)}</td>`).join('')}</tr>`).join('')}</table>
        <div style="height:5mm"></div>
        ${task('', 'Write Wh-questions to the underlined words:', 'כתוב משפטי שאלה').replace('. ', '')}
        <ol class="items">${P.W.map(x => `<li>${und(x.t)}<div class="line" style="margin:1mm 0 6mm"></div></li>`).join('')}</ol>
        <div class="pts">(5x1)</div>`;
      document.getElementById('test').innerHTML = [p1, p2, p3, p4, p5].map((h, i) => page(i + 1, h, i === 1 ? 'tight' : '')).join('');
    }

    function renderKey() {
      const cap = w => w;   // an opening word is already written with its capital in papers.js
      const h = `
        <h1>Chapter 1 (${P.n}) · answers</h1>
        <h2>A. Complete the sentences (${blanks}x1)</h2>
        <ol>${P.A.items.map(x => `<li>${fill(x.t, x.a.map(cap))}</li>`).join('')}</ol>
        <p class="note">Spare words: ${P.A.spare.join(', ')}. A word counts when it is spelled as the bank spells it; a word that opens a sentence takes a capital letter.</p>
        <div class="cols"><div><h2>B. am, is, are (5x2)</h2><ol>${P.B.map(x => `<li>${fill(x.t, x.a)}</li>`).join('')}</ol></div>
        <div><h2>C. have, has (5x2)</h2><ol>${P.C.map(x => `<li>${fill(x.t, x.a)}</li>`).join('')}</ol></div></div>
        <h2>D. a / an / some (10x1)</h2>
        <p><b>a:</b> ${P.E.a.join(', ')} &nbsp;·&nbsp; <b>an:</b> ${P.E.an.join(', ')} &nbsp;·&nbsp; <b>some:</b> ${P.E.some.join(', ')}</p>
`;
      const h2 = `
        <h1>Chapter 1 (${P.n}) · answers, page 2</h1>
        <h2>E. Pronouns (20x1)</h2>
        <table>${fCols.map(c => `<tr><td style="width:22mm"><b>${c}</b></td><td>${P.F[c].join(', ')}</td></tr>`).join('')}</table>
        <h2>F. The story (5x3)</h2>
        <ol>${P.G.qs.map(q => `<li>${esc(q.q)}<br><b class="ans">${q.a.map(esc).join(' &nbsp;/&nbsp; ')}</b></li>`).join('')}</ol>
        <p class="note">The content decides, in a full sentence or not. A "why" answer opens with Because. Question 1 needs both things.</p>
        <h2>Bonus. Wh-questions (5x1)</h2>
        <ol>${P.W.map(x => `<li>${und(x.t)} &nbsp;→&nbsp; <b class="ans">${esc(x.a)}</b></li>`).join('')}</ol>`;
      document.getElementById('key').innerHTML = page('', h, 'plain') + page('', h2, 'plain');
    }

    function renderCoach() {
      const S = D.seals;
      const names = [['A', 'A', 'משפטים עם מחסן מילים'], ['B', 'B', 'am · is · are'], ['C', 'C', 'have · has'], ['E', 'D', 'a · an · some'], ['F', 'E', 'טבלת he · she · they'], ['G', 'F', 'הסיפור'], ['W', 'Bonus', 'שאלות Wh']];
      const h = `
        <h1>דף ${P.n} · למאמן</h1>
        <p>הדף בנוי כמו המבחן: אותן משימות, אותו סדר, אותן נקודות. יושבים ליד שולחן, עם עט, בלי אייפד ובלי שעון. לא אומרים לו דבר על קצב, לא לפני ולא אחרי.</p>
        <h2>איך עובדים, לפי הסדר</h2>
        <ol>
          <li><b>משימה A:</b> קודם כותבים בעברית ליד כל מילה במחסן. רק אחר כך המשפטים. מילה שנכנסה למשפט מקבלת קו במחסן. חמש מילים נשארות בחוץ.</li>
          <li><b>הטבלאות (D ו-E):</b> מילה אחת בכל פעם, ומסמנים אותה במחסן אחרי שנכתבה.</li>
          <li><b>הסיפור:</b> דף לבן מכסה את כל מה שמתחת לפסקה. קוראים פסקה, אומרים בעברית במשפט אחד מה קרה בה, ומורידים את הדף. את התשובה מעתיקים מהסיפור. על "Why" עונים ב-<span class="en">Because</span>.</li>
          <li><b>המבט השני:</b> לפני שפותחים את דף התשובות, עוברים על כל דף עוד פעם אחת.</li>
        </ol>
        <h2>משפטים שאפשר לומר</h2>
        <div class="say">"צייד טוב עובר על השטח פעמיים. מילה שהתחבאה בפעם הראשונה נתפסת בשנייה."</div>
        <div class="say">"המילים בסיפור מקוות שתדלג על פסקה. הדף הלבן לא נותן להן."</div>
        <h2>בודקים ביחד</h2>
        <p>בודקים יחד מול דף התשובות, והוא זה שמסמן ✓. משימה שיצאה נקייה מקבלת חותם: אומרים לו את משפט הסוד שלה, והוא מקליד אותו במבצר המתאים במגרש האימונים.</p>
        <table><tr><th>משימה</th><th>מה נחשב נקי</th><th>משפט הסוד</th></tr>
          ${names.map(([k, letter, he]) => `<tr><td><span class="en">${letter}</span> · ${he}</td><td>${k === 'A' ? 'עד טעות אחת, והמילים כתובות כמו במחסן' : (k === 'F' ? 'עד שתי טעויות' : (k === 'G' ? 'ארבע תשובות נכונות מחמש' : 'הכול נכון'))}</td><td><b>${esc(S[k])}</b></td></tr>`).join('')}
        </table>
        <p class="note">את המשפטים אפשר להחליף בכל משפט שתבחרו. משימה שלא יצאה נקייה: לא אומרים עליה דבר, והיא חוזרת בדף הבא.</p>
        <h2>הסיפור בעברית, פסקה אחרי פסקה</h2>
        <ol>${P.G.he.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
      document.getElementById('coach').innerHTML = page('', h, 'plain coach');
    }

    function setView(v) {
      if (!['test', 'key', 'coach'].includes(v)) v = 'test';
      document.body.className = 'v-' + v;
      document.querySelectorAll('#bar [data-view]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v)));
    }
    document.getElementById('pick').innerHTML = D.papers.map(p => `<button data-n="${p.n}" aria-pressed="${p.n === P.n}">דף ${p.n}</button>`).join(' ');
    document.getElementById('bar').addEventListener('click', e => {
      const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.view) setView(b.dataset.view);
      else if (b.dataset.n) { qs.set('n', b.dataset.n); location.search = qs.toString(); }
      else if (b.id === 'print') window.print();
    });
    renderTest(); renderKey(); renderCoach();
    setView(qs.get('view') || 'test');
    window.__paper = { P, setView, bankWords, eWords, fWords };
  })();
  </script>
</body>
</html>
